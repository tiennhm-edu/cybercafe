# ============================================================================
# Hạ tầng phát triển cục bộ cho CyberCafe (Buổi 36–41 · Docker Compose).
#   docker compose up -d            # SQL Server 2022
#   docker compose ps               # đợi cột STATUS = healthy
#   docker compose down             # dừng (dữ liệu vẫn còn trong volume)
#   docker compose down -v          # dừng + XÓA dữ liệu (làm lại từ đầu)
# Mật khẩu / cổng lấy từ file .env (copy từ .env.example). Không có .env → dùng giá trị mặc định sau dấu ":-".
# Cổng host mặc định 1434 (không phải 1433) để chạy song song với SQL Server của lab nếu đang bật.
# ============================================================================
name: cybercafe

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Mật khẩu GIẢ cho máy dev. SQL Server yêu cầu ≥ 8 ký tự, có hoa, thường, số, ký tự đặc biệt.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Fake_Passw0rd_ChangeMe}
    ports:
      - "${MSSQL_PORT:-1434}:1433"
    volumes:
      # Volume có tên: xóa container (docker compose down) KHÔNG mất database
      - cybercafe-sql:/var/opt/mssql
    healthcheck:
      # Healthy = đăng nhập và chạy được SELECT 1 (container "running" chưa chắc SQL đã sẵn sàng)
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  cybercafe-sql:
