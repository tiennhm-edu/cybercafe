# ============================================================================
# Hạ tầng phát triển cục bộ cho CyberCafe (Buổi 36–41 · Docker Compose; Buổi 42–47 thêm Redis).
#   docker compose up -d            # SQL Server 2022 + Redis 7
#   docker compose ps               # đợi cột STATUS = healthy
#   docker compose down             # dừng (dữ liệu vẫn còn trong volume)
#   docker compose down -v          # dừng + XÓA dữ liệu (làm lại từ đầu)
# Mật khẩu / cổng lấy từ file .env (copy từ .env.example). Không có .env → dùng giá trị mặc định sau dấu ":-".
# Từ tag b55-microservice: cách chạy chính là .NET Aspire (dotnet run --project src/CyberCafe.AppHost) — file này giữ
# cho các tag b40–b53 và cho việc chạy Api lẻ (thanh toán InProcess, không RabbitMQ).
# Cổng host mặc định 1434 / 6380 (không phải 1433 / 6379) để chạy song song với container của lab nếu đang bật.
# ============================================================================
name: cybercafe

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Mật khẩu GIẢ cho máy dev. SQL Server yêu cầu ≥ 8 ký tự, có hoa, thường, số, ký tự đặc biệt.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Fake_Passw0rd_ChangeMe}
    ports:
      - "${MSSQL_PORT:-1434}:1433"
    volumes:
      # Volume có tên: xóa container (docker compose down) KHÔNG mất database
      - cybercafe-sql:/var/opt/mssql
    healthcheck:
      # Healthy = đăng nhập và chạy được SELECT 1 (container "running" chưa chắc SQL đã sẵn sàng)
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Buổi 42–47: Redis làm distributed cache cho thực đơn (Api dùng khi Redis:Enabled = true).
  # Không mount volume: cache mất khi xóa container là CHẤP NHẬN ĐƯỢC — database mới là nguồn sự thật.
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  cybercafe-sql:
