name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'b*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CyberCafe.slnx

      - name: Build
        run: dotnet build CyberCafe.slnx --no-restore -c Release

      - name: Test
        run: dotnet test CyberCafe.slnx --no-build -c Release --verbosity normal
