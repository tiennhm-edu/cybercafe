name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'b*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (theo global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CyberCafe.slnx

      - name: Build
        run: dotnet build CyberCafe.slnx --no-restore -c Release

      # Không cần SQL Server/Docker: test tích hợp Api dùng EF Core InMemory
      - name: Test
        run: dotnet test CyberCafe.slnx --no-build -c Release --verbosity normal
